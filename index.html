<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f2eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111310" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Daily Board" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Daily Board</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#f4f2eb;--paper:#fbfaf6;--text:#20231f;--muted:#696f68;
      --line:#d9d7cf;--accent:#496052;--soft:#e3e9e2;--radius:22px;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#111310;--paper:#181a17;--text:#f2f1eb;--muted:#a8ada7;
      --line:#343832;--accent:#b8cfbf;--soft:#243028;
    }}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;line-height:1.75}
    a{color:inherit}
    .page{max-width:820px;margin:0 auto;padding:34px 20px 70px}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
    h1{font-size:clamp(38px,8vw,62px);line-height:1;letter-spacing:-.05em;margin:8px 0 8px}
    .date,.updated{color:var(--muted);font-size:14px}.updated{margin-top:4px}
    .intro{font-size:18px;line-height:1.75;color:var(--muted);margin:30px 0 36px;padding-bottom:28px;border-bottom:1px solid var(--line)}
    .toc{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:32px}
    .toc b{display:block;margin-bottom:8px}.toc a{display:block;text-decoration:none;color:var(--muted);padding:5px 0}.toc a:hover{color:var(--text)}
    article{padding:8px 0 44px;margin-bottom:38px;border-bottom:1px solid var(--line)}
    .category{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
    h2{font-size:clamp(28px,6vw,42px);line-height:1.14;letter-spacing:-.035em;margin:0 0 14px}
    .dek{font-size:18px;color:var(--muted);margin:0 0 30px}
    .section{margin:28px 0}.section h3{font-size:15px;letter-spacing:.02em;margin:0 0 8px}.section p{font-size:17px;margin:0;color:var(--text)}
    .section.background{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
    .section.why{background:var(--soft);border-radius:18px;padding:18px 20px}
    .section.limit p{color:var(--muted)}
    .sources{margin-top:28px}.sources h3{font-size:14px}.sources a{display:block;color:var(--accent);margin:6px 0;word-break:break-word}
    .radar{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:10px 0 28px}
    .radar .label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
    .radar h2{font-size:25px;margin:8px 0}.radar p{margin:0;color:var(--muted)}
    .mail{border-top:1px solid var(--line);padding-top:24px;color:var(--muted);font-size:14px}
    .mail strong{color:var(--text)}
    .status{position:fixed;right:14px;bottom:14px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--muted);box-shadow:0 8px 30px rgba(0,0,0,.12)}
    @media(max-width:520px){.page{padding:24px 16px 64px}.intro{font-size:16px}.section p{font-size:16px}.dek{font-size:16px}.status{display:none}}
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">Personal science reading board</div>
    <h1>Daily Board</h1>
    <div class="date" id="date">載入中…</div>
    <div class="updated" id="updated"></div>

    <p class="intro" id="intro">正在讀取今天的報告…</p>

    <nav class="toc" id="toc" hidden>
      <b>今天的閱讀</b>
    </nav>

    <section id="stories"></section>

    <section class="radar" id="radar" hidden>
      <div class="label">Research & Career Radar</div>
      <h2 id="radarTitle"></h2>
      <p id="radarSummary"></p>
    </section>

    <section class="mail">
      <strong>Important Mail</strong>
      <div id="mailStatus">載入中…</div>
    </section>
  </main>

  <div class="status" id="status">讀取資料中</div>

  <script>
    const dateFmt = new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
    const timeFmt = new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});

    function pSection(title, text, cls=''){
      if(!text) return null;
      const box=document.createElement('section');
      box.className=`section ${cls}`;
      const h=document.createElement('h3'); h.textContent=title;
      const p=document.createElement('p'); p.textContent=text;
      box.append(h,p); return box;
    }

    function render(data){
      const d=new Date(`${data.date}T12:00:00+08:00`);
      document.getElementById('date').textContent=dateFmt.format(d);
      if(data.updatedAt){document.getElementById('updated').textContent=`最後更新 ${timeFmt.format(new Date(data.updatedAt))}`;}
      document.getElementById('intro').textContent=data.report?.intro || '';

      const stories=data.report?.stories || [];
      const toc=document.getElementById('toc');
      const holder=document.getElementById('stories');
      holder.replaceChildren();
      toc.querySelectorAll('a').forEach(a=>a.remove());

      if(stories.length){toc.hidden=false;}
      stories.forEach((s,i)=>{
        const id=`story-${i+1}`;
        const link=document.createElement('a'); link.href=`#${id}`; link.textContent=`${i+1}. ${s.title}`; toc.appendChild(link);

        const article=document.createElement('article'); article.id=id;
        const cat=document.createElement('div'); cat.className='category'; cat.textContent=s.category || `Story ${i+1}`;
        const title=document.createElement('h2'); title.textContent=s.title || '未命名文章';
        const dek=document.createElement('p'); dek.className='dek'; dek.textContent=s.dek || '';
        article.append(cat,title,dek);

        [
          ['先懂背景',s.background,'background'],
          ['這次發生了什麼',s.whatHappened,''],
          ['研究者怎麼知道的',s.howTheyStudied,''],
          ['為什麼重要',s.whyItMatters,'why'],
          ['有哪些限制',s.limitations,'limit'],
          ['接下來要看什麼',s.whatNext,'']
        ].forEach(([h,t,c])=>{const el=pSection(h,t,c);if(el) article.appendChild(el);});

        if(Array.isArray(s.sources) && s.sources.length){
          const src=document.createElement('div'); src.className='sources';
          const h=document.createElement('h3'); h.textContent='原始來源與延伸閱讀'; src.appendChild(h);
          s.sources.forEach(item=>{const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener';a.textContent=item.label || item.url;src.appendChild(a);});
          article.appendChild(src);
        }
        holder.appendChild(article);
      });

      const radar=data.report?.radar;
      const radarEl=document.getElementById('radar');
      if(radar?.title){radarEl.hidden=false;document.getElementById('radarTitle').textContent=radar.title;document.getElementById('radarSummary').textContent=radar.summary || '';}
      else radarEl.hidden=true;

      const mail=data.importantMail || {};
      document.getElementById('mailStatus').textContent=mail.count>0 ? `${mail.count} 封需要注意。詳細內容不會存放在公開 Daily Board。` : '目前沒有需要顯示的重要郵件。';
      document.getElementById('status').textContent='資料已同步';
    }

    async function load(){
      try{
        const r=await fetch(`data/daily.json?t=${Date.now()}`,{cache:'no-store'});
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        render(await r.json());
      }catch(e){
        document.getElementById('status').textContent='資料讀取失敗';
        document.getElementById('intro').textContent='暫時無法讀取今天的 Daily Board，請稍後再試。';
        console.error(e);
      }
    }
    load();
    if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}
  </script>
</body>
</html>
