<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Board" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Daily Board</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f5f2ea;
      --surface:#fbfaf6;
      --surface-2:#efece3;
      --text:#1b1d19;
      --muted:#6f736a;
      --line:#dad7cd;
      --accent:#43584b;
      --accent-soft:#dfe7df;
      --urgent:#8b3f36;
      --urgent-soft:#f1dfdc;
      --shadow:0 18px 45px rgba(35,37,32,.08);
      --radius:26px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#111210;
        --surface:#181a17;
        --surface-2:#22251f;
        --text:#f3f1e9;
        --muted:#a8aca2;
        --line:#343830;
        --accent:#b7ccb9;
        --accent-soft:#27342a;
        --urgent:#efaaa1;
        --urgent-soft:#472b28;
        --shadow:0 22px 55px rgba(0,0,0,.22);
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    button,a{font:inherit}
    .shell{max-width:1220px;margin:0 auto;padding:28px 22px 42px}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}
    .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
    h1{font-size:clamp(34px,5vw,64px);line-height:.95;letter-spacing:-.055em;margin:0;font-weight:760}
    .date{font-size:15px;color:var(--muted);margin-top:10px}
    .status{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:999px;color:var(--muted);font-size:13px;white-space:nowrap}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
    .dot.error{background:var(--urgent)}
    .demo{margin:0 0 20px;border:1px dashed var(--line);border-radius:18px;padding:12px 14px;color:var(--muted);font-size:13px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
    .grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(280px,.72fr);gap:20px;align-items:start}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .panel-head{padding:22px 22px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}
    .panel-title{font-size:19px;font-weight:730;letter-spacing:-.02em}
    .panel-sub{font-size:13px;color:var(--muted);margin-top:4px}
    .count{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
    .lead{padding:24px 22px 4px}
    .lead-kicker{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--accent);font-size:12px;font-weight:780;letter-spacing:.08em;text-transform:uppercase}
    .lead h2{font-size:clamp(26px,3.5vw,42px);line-height:1.08;letter-spacing:-.045em;margin:0 0 12px;max-width:880px}
    .lead p{font-size:16px;line-height:1.72;color:var(--muted);margin:0 0 18px;max-width:850px}
    .why{background:var(--accent-soft);border-radius:19px;padding:15px 16px;margin-bottom:18px}
    .why b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
    .why span{font-size:14px;line-height:1.55}
    .stories{padding:4px 22px 8px}
    .story{display:grid;grid-template-columns:38px 1fr;gap:14px;padding:18px 0;border-top:1px solid var(--line)}
    .story-num{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:3px}
    .story h3{font-size:18px;line-height:1.32;letter-spacing:-.02em;margin:0 0 7px}
    .story p{font-size:14px;line-height:1.58;color:var(--muted);margin:0}
    .tagrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
    .tag{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
    .radar{margin:10px 22px 22px;padding:17px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--surface-2),var(--surface))}
    .radar[hidden]{display:none}
    .radar-label{font-size:12px;font-weight:780;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
    .radar h3{font-size:17px;margin:0 0 6px;letter-spacing:-.02em}
    .radar p{font-size:13px;line-height:1.55;color:var(--muted);margin:0}
    .panel-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;border-top:1px solid var(--line)}
    .updated{font-size:12px;color:var(--muted)}
    .action{border:0;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}
    .action.disabled{opacity:.45;pointer-events:none}
    .mail-list{padding:8px 16px 10px}
    .mail{padding:15px 8px;border-bottom:1px solid var(--line)}
    .mail:last-child{border-bottom:0}
    .mail-top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:7px}
    .sender{font-size:13px;font-weight:720}
    .mail-badge{font-size:10px;font-weight:760;padding:4px 7px;border-radius:999px;background:var(--urgent-soft);color:var(--urgent)}
    .mail h3{font-size:15px;line-height:1.35;margin:0 0 6px;letter-spacing:-.015em}
    .mail p{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0}
    .clear{display:none;padding:28px 22px 30px;text-align:center;color:var(--muted)}
    .clear.show{display:block}
    .clear-icon{font-size:26px;margin-bottom:8px}
    .mini-note{padding:0 22px 18px;color:var(--muted);font-size:12px;line-height:1.55}
    .error-box{display:none;margin:0 0 20px;border:1px solid var(--urgent);border-radius:18px;padding:12px 14px;color:var(--urgent);font-size:13px;background:var(--urgent-soft)}
    .error-box.show{display:block}
    @media(max-width:820px){
      .shell{padding:22px 14px 34px}.grid{grid-template-columns:1fr}.topbar{align-items:flex-end}.status{font-size:12px}.panel{border-radius:22px}.mail-panel{box-shadow:none}.panel-head,.lead,.stories,.panel-foot{padding-left:18px;padding-right:18px}.radar{margin-left:18px;margin-right:18px}
    }
    @media(max-width:480px){
      .status .label{display:none}.status{padding:9px}.shell{padding-top:18px}.topbar{margin-bottom:18px}.lead h2{font-size:28px}.panel-head{align-items:flex-start}.panel-foot{align-items:flex-start;flex-direction:column}.action{width:100%;text-align:center}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Personal information board</div>
        <h1>Daily Board</h1>
        <div class="date" id="dateLine">載入中…</div>
      </div>
      <div class="status"><span class="dot" id="statusDot"></span><span class="label" id="statusText">讀取資料中</span></div>
    </header>

    <div class="demo">v0.2：畫面已和每日內容分離。現在這一頁會從 <strong>data/daily.json</strong> 讀取資料。</div>
    <div class="error-box" id="errorBox"></div>

    <section class="grid">
      <article class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">Biomed / Neuroscience</div>
            <div class="panel-sub">今天值得你知道的研究與機會</div>
          </div>
          <span class="count" id="storyCount">—</span>
        </div>

        <div class="lead">
          <div class="lead-kicker">● Lead story</div>
          <h2 id="leadTitle">載入中…</h2>
          <p id="leadSummary"></p>
          <div class="why">
            <b>Why it matters</b>
            <span id="leadWhy"></span>
          </div>
          <div class="tagrow" id="leadTags"></div>
        </div>

        <div class="stories" id="stories"></div>

        <div class="radar" id="radar" hidden>
          <div class="radar-label">Research & career radar</div>
          <h3 id="radarTitle"></h3>
          <p id="radarSummary"></p>
        </div>

        <div class="panel-foot">
          <span class="updated" id="updatedText">Updated —</span>
          <a class="action disabled" id="fullReportLink" href="#">完整報告尚未連接</a>
        </div>
      </article>

      <aside class="panel mail-panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">Important Mail</div>
            <div class="panel-sub">只有需要你注意的信</div>
          </div>
          <span class="count" id="mailCount">—</span>
        </div>
        <div class="mail-list" id="mailList"></div>
        <div class="clear" id="mailClear"><div class="clear-icon">✓</div><strong>All clear</strong><div>今天沒有需要你處理的重要郵件。</div></div>
        <div class="mini-note">設計原則：資訊必須「值得占據版面」才會出現。</div>
      </aside>
    </section>
  </main>

  <script>
    const dateFmt = new Intl.DateTimeFormat('zh-TW', {
      weekday:'long', year:'numeric', month:'long', day:'numeric'
    });
    const timeFmt = new Intl.DateTimeFormat('zh-TW', {
      hour:'2-digit', minute:'2-digit', hour12:false
    });

    function text(id, value = '') {
      document.getElementById(id).textContent = value;
    }

    function makeTag(label) {
      const el = document.createElement('span');
      el.className = 'tag';
      el.textContent = label;
      return el;
    }

    function parseDate(value) {
      if (!value) return new Date();
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? new Date() : d;
    }

    function render(data) {
      const boardDate = parseDate(data.date ? `${data.date}T12:00:00+08:00` : null);
      text('dateLine', dateFmt.format(boardDate));

      const report = data.report || {};
      const lead = report.lead || {};
      const stories = Array.isArray(report.stories) ? report.stories : [];

      text('leadTitle', lead.title || '今天尚未產生生醫摘要');
      text('leadSummary', lead.summary || '等每日摘要資料寫入後，內容會出現在這裡。');
      text('leadWhy', lead.why || '尚無內容。');
      text('storyCount', `${1 + stories.length} stories`);

      const leadTags = document.getElementById('leadTags');
      leadTags.replaceChildren();
      (lead.tags || []).forEach(tag => leadTags.appendChild(makeTag(tag)));

      const storiesEl = document.getElementById('stories');
      storiesEl.replaceChildren();
      stories.forEach((story, index) => {
        const article = document.createElement('div');
        article.className = 'story';

        const num = document.createElement('div');
        num.className = 'story-num';
        num.textContent = String(index + 2).padStart(2, '0');

        const body = document.createElement('div');
        const title = document.createElement('h3');
        title.textContent = story.title || 'Untitled';
        const summary = document.createElement('p');
        summary.textContent = story.summary || '';
        const tags = document.createElement('div');
        tags.className = 'tagrow';
        (story.tags || []).forEach(tag => tags.appendChild(makeTag(tag)));

        body.append(title, summary);
        if ((story.tags || []).length) body.appendChild(tags);
        article.append(num, body);
        storiesEl.appendChild(article);
      });

      const radar = document.getElementById('radar');
      if (report.radar && (report.radar.title || report.radar.summary)) {
        radar.hidden = false;
        text('radarTitle', report.radar.title || '值得追蹤');
        text('radarSummary', report.radar.summary || '');
      } else {
        radar.hidden = true;
      }

      const fullReportLink = document.getElementById('fullReportLink');
      if (report.fullReportUrl) {
        fullReportLink.href = report.fullReportUrl;
        fullReportLink.textContent = '閱讀完整報告';
        fullReportLink.classList.remove('disabled');
      } else {
        fullReportLink.href = '#';
        fullReportLink.textContent = '完整報告尚未連接';
        fullReportLink.classList.add('disabled');
      }

      const mail = Array.isArray(data.importantMail) ? data.importantMail : [];
      text('mailCount', String(mail.length));
      const mailList = document.getElementById('mailList');
      const mailClear = document.getElementById('mailClear');
      mailList.replaceChildren();

      if (mail.length === 0) {
        mailList.style.display = 'none';
        mailClear.classList.add('show');
      } else {
        mailList.style.display = '';
        mailClear.classList.remove('show');
        mail.forEach(item => {
          const card = document.createElement('div');
          card.className = 'mail';

          const top = document.createElement('div');
          top.className = 'mail-top';
          const sender = document.createElement('span');
          sender.className = 'sender';
          sender.textContent = item.sender || 'Important Mail';
          const badge = document.createElement('span');
          badge.className = 'mail-badge';
          badge.textContent = item.status || 'Attention';
          top.append(sender, badge);

          const title = document.createElement('h3');
          title.textContent = item.title || '需要注意的郵件';
          const summary = document.createElement('p');
          summary.textContent = item.summary || '';

          card.append(top, title, summary);
          mailList.appendChild(card);
        });
      }

      const updated = parseDate(data.updatedAt);
      text('updatedText', `Updated ${timeFmt.format(updated)}`);
      text('statusText', '資料已同步');
      document.getElementById('statusDot').classList.remove('error');
    }

    function showError(message) {
      const box = document.getElementById('errorBox');
      box.textContent = message;
      box.classList.add('show');
      text('statusText', '資料讀取失敗');
      document.getElementById('statusDot').classList.add('error');
    }

    async function loadBoard() {
      try {
        const response = await fetch(`./data/daily.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        render(data);
      } catch (error) {
        console.error(error);
        showError('無法讀取 data/daily.json。請不要直接雙擊 index.html；請用 VS Code Live Server 或在終端機啟動本機伺服器。');
      }
    }

    loadBoard();

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./service-worker.js').catch(console.error);
    }
  </script>
</body>
</html>
